name: Infernal Native v0.6 Android
on:
  push:
    branches: [infernal-native-v06-controller]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unpack ROM-free project
        run: |
          mkdir -p imn-v06-project
          tar -xJf imn-v06/project.tar.xz -C imn-v06-project
          grep -F 'renderer/rendering_method.mobile="forward_plus"' imn-v06-project/project.godot
          grep -F '3d/physics_engine="Jolt Physics"' imn-v06-project/project.godot
      - name: Provision official Godot Android toolchain
        run: python3 imn-v06-project/tools/build/bootstrap_toolchain.py "$GITHUB_WORKSPACE/imn-v06/toolchain"
      - name: Run Godot tests and build signed APK
        shell: bash
        run: |
          set -euo pipefail
          export NATIVE_TOOLCHAIN_ROOT="$GITHUB_WORKSPACE/imn-v06/toolchain"
          cd imn-v06-project
          GODOT="$NATIVE_TOOLCHAIN_ROOT/godot/Godot_v4.7.2-stable_linux.x86_64"
          export XDG_DATA_HOME="$NATIVE_TOOLCHAIN_ROOT/xdg/data"
          export XDG_CONFIG_HOME="$NATIVE_TOOLCHAIN_ROOT/xdg/config"
          export XDG_CACHE_HOME="$NATIVE_TOOLCHAIN_ROOT/xdg/cache"
          "$GODOT" --headless --path . --import
          for test in smoke controller_smoke course_smoke gameplay_smoke action_smoke; do
            "$GODOT" --headless --path . --fixed-fps 60 --script "tests/godot/$test.gd"
          done
          bash platforms/android/export_debug.sh "$PWD/builds/InfernalNative_v0.6_arm64.apk"
          test -s builds/InfernalNative_v0.6_arm64.apk
          sha256sum builds/InfernalNative_v0.6_arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: InfernalNative-v0.6-ARM64-debug
          path: imn-v06-project/builds/InfernalNative_v0.6_arm64.apk
          if-no-files-found: error
