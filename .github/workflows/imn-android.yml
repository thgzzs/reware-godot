name: Infernal Machine Native ARM64 APK (isolated)
on:
  push:
    branches: [imn-android-build-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1'
      - name: Unpack clean-room project
        run: |
          mkdir -p imn-build/project
          tar -xJf imn-build/source.tar.xz -C imn-build/project
          grep -F 'renderer/rendering_method.mobile="forward_plus"' imn-build/project/project.godot
          grep -F '3d/physics_engine="Jolt Physics"' imn-build/project/project.godot
      - name: Download official Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot-bin "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          echo 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  /tmp/templates.tpz' | sha256sum -c -
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Export Android ARM64 APK using official engine
        shell: bash
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          set -euo pipefail
          cd imn-build/project
          keytool -genkeypair -keystore /tmp/imn-debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 5000 -dname 'CN=Independent Debug Build'
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/tmp/imn-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          "$GODOT_BIN" --headless --path . --import
          mkdir -p builds
          "$GODOT_BIN" --headless --path . --export-debug "Android Vulkan ARM64" "$PWD/builds/NativeLab_android_arm64_v0.5.apk"
          test -s builds/NativeLab_android_arm64_v0.5.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify builds/NativeLab_android_arm64_v0.5.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging builds/NativeLab_android_arm64_v0.5.apk
          sha256sum builds/NativeLab_android_arm64_v0.5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: InfernalMachineNative-v0.5-ARM64-debug
          path: imn-build/project/builds/NativeLab_android_arm64_v0.5.apk
          if-no-files-found: error
